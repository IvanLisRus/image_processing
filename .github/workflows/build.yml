name: Build Cross-Platform Libraries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopencv-dev
        
      - name: Build SO
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processing-linux
          path: build/libimage_processing.so

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and Extract OpenCV
        shell: pwsh
        run: |
          Write-Host "=== 1. Downloading OpenCV 4.10.0 ==="
          # Invoke-WebRequest надежнее для GitHub Releases в среде Windows
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe" -OutFile "opencv.exe"
          
          Write-Host "=== 2. Verifying download size ==="
          $file = Get-Item "opencv.exe"
          if ($file.Length -lt 100MB) {
            throw "Downloaded file is too small ($($file.Length) bytes). Download likely failed or returned HTML."
          }
          
          Write-Host "=== 3. Extracting OpenCV to C:\opencv ==="
          # 7z предустановлен на windows-latest
          7z x opencv.exe -oC:\opencv -y
          
          Write-Host "=== 4. Verifying extraction ==="
          if (!(Test-Path "C:\opencv\opencv\build")) {
            throw "OpenCV build directory not found at C:\opencv\opencv\build after extraction!"
          }
          Write-Host "OpenCV extracted successfully."

      - name: Build DLL
        shell: pwsh
        run: |
          Write-Host "=== 5. Configuring CMake ==="
          mkdir build
          cd build
          
          # Используем жесткий абсолютный путь с прямыми слешами (CMake это любит)
          cmake -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR:PATH="C:/opencv/opencv/build" ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          
          Write-Host "=== 6. Building Release ==="
          cmake --build . --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }
          
          Write-Host "=== 7. Verifying output ==="
          Get-ChildItem -Path ".\Release\*.dll"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processing-windows
          path: build/Release/image_processing.dll
