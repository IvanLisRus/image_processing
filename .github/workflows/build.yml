name: Build Cross-Platform Libraries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopencv-dev
        
      - name: Build SO
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make
          
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processing-linux
          # ИСПРАВЛЕНО: правильное имя файла, которое генерирует CMake
          path: build/libimage_processing.so

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download OpenCV
        run: |
          # Скачиваем ZIP-архив вместо EXE для более надежной распаковки
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-windows.zip" -OutFile "opencv.zip"
          # Распаковываем в корень диска C: (получится C:\opencv)
          Expand-Archive -Path opencv.zip -DestinationPath C:\ -Force
          
      - name: Build DLL
        run: |
          mkdir build
          cd build
          # Путь указывает прямо на папку build внутри распакованного архива
          cmake -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR="C:/opencv/build" ..
          cmake --build . --config Release
          
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processing-windows
          path: build/Release/image_processing.dll
