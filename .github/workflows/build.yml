name: Build and Commit Libraries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Разрешаем воркфлоу записывать изменения (делать коммиты) в репозиторий
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopencv-dev
        
      - name: Build SO
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          
      - name: Prepare Linux Binaries
        run: |
          echo "=== Подготовка файлов для папки linux_x64 ==="
          mkdir -p linux_x64
          # Копируем нашу библиотеку (без префикса lib, если CMakeLists.txt обновлен)
          cp build/image_processing.so linux_x64/ || cp build/libimage_processing.so linux_x64/image_processing.so
          # Копируем зависимости OpenCV
          cp /usr/lib/x86_64-linux-gnu/libopencv_core.so* linux_x64/
          cp /usr/lib/x86_64-linux-gnu/libopencv_imgproc.so* linux_x64/
          ls -la linux_x64/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and Extract OpenCV
        shell: pwsh
        run: |
          Write-Host "=== 1. Downloading OpenCV 4.10.0 ==="
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe" -OutFile "opencv.exe"
          
          Write-Host "=== 2. Verifying download size ==="
          $file = Get-Item "opencv.exe"
          if ($file.Length -lt 100MB) {
            throw "Downloaded file is too small ($($file.Length) bytes)."
          }
          
          Write-Host "=== 3. Extracting OpenCV to C:\opencv ==="
          7z x opencv.exe -oC:\opencv -y
          
      - name: Build DLL
        shell: pwsh
        run: |
          Write-Host "=== 4. Configuring CMake ==="
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR:PATH="C:/opencv/opencv/build" ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          
          Write-Host "=== 5. Building Release ==="
          cmake --build . --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }
          
      - name: Prepare Windows Binaries
        shell: pwsh
        run: |
          Write-Host "=== 6. Подготовка файлов для папки windows_x64 ==="
          New-Item -ItemType Directory -Force -Path "windows_x64"
          
          # Копируем нашу DLL
          Copy-Item -Path "build\Release\image_processing.dll" -Destination "windows_x64\" -Force
          
          # Автоматически находим и копируем все DLL OpenCV
          Write-Host "=== Поиск DLL OpenCV ==="
          $opencv_build = "C:\opencv\opencv\build"
          
          # Ищем папку bin в структуре x64 (vc16, vc17, или другая)
          $bin_path = Get-ChildItem -Path $opencv_build -Recurse -Directory -Filter "bin" | 
                      Where-Object { $_.FullName -match "x64" } | 
                      Select-Object -First 1 -ExpandProperty FullName
          
          if ($bin_path) {
            Write-Host "Найдена папка bin: $bin_path"
            # Копируем все DLL OpenCV (opencv_*.dll)
            Get-ChildItem -Path "$bin_path\opencv_*.dll" | ForEach-Object {
              Write-Host "Копирование: $($_.Name)"
              Copy-Item -Path $_.FullName -Destination "windows_x64\" -Force
            }
          } else {
            throw "Не удалось найти папку bin OpenCV в $opencv_build"
          }
          
          Write-Host "Файлы в папке windows_x64:"
          Get-ChildItem -Path "windows_x64\*.dll" | Select-Object Name

  commit-binaries:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    # Запускаем этот этап только если это push в main/master (чтобы не коммитить во время PR)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      
      - name: Commit and Push Binaries
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update pre-built binaries (DLL/SO)"
          file_pattern: "windows_x64/*.dll linux_x64/*.so*"
          commit_author: "GitHub Actions <actions@github.com>"
