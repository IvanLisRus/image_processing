name: Build and Commit Libraries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      # 🚀 Кэширование apt пакетов для молниеносных последующих сборок
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-
      
      - name: Install MINIMAL dependencies
        run: |
          echo "🔧 Исправление источников apt (обход бага GitHub Actions с Azure mirrors)..."
          
          # 1. Удаляем проблемный файл зеркал
          sudo rm -f /etc/apt/apt-mirrors.txt
          
          # 2. Заменяем все упоминания 'mirror+file:/etc/apt/apt-mirrors.txt' на стандартный archive.ubuntu.com
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/*.list 2>/dev/null || true
          
          # 3. На всякий случай заменяем и прямые ссылки на azure
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/*.list 2>/dev/null || true
          
          # 4. Очищаем кэш списков пакетов, чтобы убрать битые записи
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "🔄 Обновление списков пакетов..."
          sudo apt-get update -y
          
          echo "📦 Установка минимальных зависимостей..."
          sudo apt-get install -y cmake build-essential libopencv-core-dev libopencv-imgproc-dev
      
      - name: Build SO
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
      
      - name: Prepare Linux Binaries
        run: |
          echo "=== Подготовка библиотеки ==="
          rm -rf linux_x64
          mkdir -p linux_x64
          
          # 1. Копируем нашу библиотеку
          cp build/image_processing.so linux_x64/
          
          # 2. Копируем только нужные runtime .so файлы
          echo "=== Копирование OpenCV runtime ==="
          cp /usr/lib/x86_64-linux-gnu/libopencv_core.so.4.5.4 linux_x64/ 2>/dev/null || \
          cp /usr/lib/x86_64-linux-gnu/libopencv_core.so.4.5d linux_x64/ 2>/dev/null || true
          
          cp /usr/lib/x86_64-linux-gnu/libopencv_imgproc.so.4.5.4 linux_x64/ 2>/dev/null || \
          cp /usr/lib/x86_64-linux-gnu/libopencv_imgproc.so.4.5d linux_x64/ 2>/dev/null || true
          
          # 3. Копируем TBB
          echo "=== Копирование TBB ==="
          cp /usr/lib/x86_64-linux-gnu/libtbb.so.2 linux_x64/ 2>/dev/null || \
          cp /usr/lib/x86_64-linux-gnu/libtbb.so.12 linux_x64/ 2>/dev/null || true
          
          # 4. Итоговый список (без симлинков, только реальные файлы для FAT-флешки)
          echo "=== Итоговый список файлов ==="
          ls -lh linux_x64/
          
          echo "=== Проверка зависимостей ==="
          cd linux_x64
          ldd image_processing.so | grep -E "(opencv|tbb|not found)" || echo "Все зависимости найдены"
          cd ..
      
      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: linux_x64/
          

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and Extract OpenCV
        shell: pwsh
        run: |
          Write-Host "=== 1. Downloading OpenCV 4.10.0 ==="
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe" -OutFile "opencv.exe"
          
          Write-Host "=== 2. Verifying download size ==="
          $file = Get-Item "opencv.exe"
          if ($file.Length -lt 100MB) {
            throw "Downloaded file is too small ($($file.Length) bytes)."
          }
          
          Write-Host "=== 3. Extracting OpenCV to C:\opencv ==="
          7z x opencv.exe -oC:\opencv -y
          
      - name: Build DLL
        shell: pwsh
        run: |
          Write-Host "=== 4. Configuring CMake ==="
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR:PATH="C:/opencv/opencv/build" ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          
          Write-Host "=== 5. Building Release ==="
          cmake --build . --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }
          
      - name: Prepare Windows Binaries
        shell: pwsh
        run: |
          Write-Host "=== 6. Подготовка файлов для папки windows_x64 ==="
          Remove-Item -Path "windows_x64" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "windows_x64"
          
          Copy-Item -Path "build\Release\image_processing.dll" -Destination "windows_x64\" -Force
          
          Write-Host "=== Копирование зависимостей OpenCV ==="
          $opencv_build = "C:\opencv\opencv\build"
          $bin_path = Get-ChildItem -Path $opencv_build -Recurse -Directory -Filter "bin" | 
                      Where-Object { $_.FullName -match "x64" } | 
                      Select-Object -First 1 -ExpandProperty FullName
          
          if ($bin_path) {
            Write-Host "Найдена папка bin: $bin_path"
            
            $world_dll = Get-ChildItem -Path $bin_path -Filter "opencv_world4100.dll" | Select-Object -First 1
            
            if ($world_dll) {
              Write-Host "Копирование: $($world_dll.Name) ($([math]::Round($world_dll.Length/1MB, 2)) MB)"
              Copy-Item -Path $world_dll.FullName -Destination "windows_x64\" -Force
            } else {
              Write-Host "opencv_world4100.dll не найден, ищем раздельные модули..."
              Get-ChildItem -Path $bin_path -Filter "opencv_core*.dll" | Where-Object { $_.Name -notlike "*d.dll" } | ForEach-Object {
                Write-Host "Копирование: $($_.Name)"
                Copy-Item -Path $_.FullName -Destination "windows_x64\" -Force
              }
              Get-ChildItem -Path $bin_path -Filter "opencv_imgproc*.dll" | Where-Object { $_.Name -notlike "*d.dll" } | ForEach-Object {
                Write-Host "Копирование: $($_.Name)"
                Copy-Item -Path $_.FullName -Destination "windows_x64\" -Force
              }
            }
          } else {
            throw "Не удалось найти папку bin OpenCV в $opencv_build"
          }
          
          Write-Host "Итоговый состав папки windows_x64:"
          Get-ChildItem -Path "windows_x64\*.dll" | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB, 2)}}
      
      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: windows_x64/

  commit-binaries:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean old binaries from git
        run: |
          git rm -rf linux_x64/* 2>/dev/null || true
          git rm -rf windows_x64/* 2>/dev/null || true
          git commit -m "chore: clean old binaries" --allow-empty || true
      
      - name: Download Linux Binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: linux_x64
      
      - name: Download Windows Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows_x64
      
      - name: Commit and Push Binaries
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update pre-built binaries (DLL/SO)"
          file_pattern: "windows_x64/*.dll linux_x64/*.so*"
          commit_author: "GitHub Actions <actions@github.com>"
