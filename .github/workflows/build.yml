name: Build and Commit Libraries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopencv-dev
      
      - name: Build SO
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
      
      - name: Prepare Linux Binaries
        run: |
          echo "=== Подготовка автономной библиотеки ==="
          rm -rf linux_x64
          mkdir -p linux_x64
          
          # 1. Копируем нашу библиотеку
          cp build/image_processing.so linux_x64/ 2>/dev/null || cp build/libimage_processing.so linux_x64/image_processing.so
          
          # 2. Проверяем, какие версии OpenCV установлены
          echo "=== Поиск всех версий OpenCV ==="
          echo "Все файлы libopencv_core:"
          find /usr -name "libopencv_core.so*" -type f 2>/dev/null | sort
          echo "Все файлы libopencv_imgproc:"
          find /usr -name "libopencv_imgproc.so*" -type f 2>/dev/null | sort
          
          # 3. Ищем RELEASE-версии (без суффикса 'd')
          echo "=== Поиск release-версий ==="
          CORE_RELEASE=$(find /usr -name "libopencv_core.so.[0-9]*" -type f ! -name "*d" 2>/dev/null | sort | tail -1)
          IMGPROC_RELEASE=$(find /usr -name "libopencv_imgproc.so.[0-9]*" -type f ! -name "*d" 2>/dev/null | sort | tail -1)
          
          if [ -n "$CORE_RELEASE" ] && [ -n "$IMGPROC_RELEASE" ]; then
            echo "✓ Найдены release-версии:"
            echo "  Core: $CORE_RELEASE"
            echo "  ImgProc: $IMGPROC_RELEASE"
            
            # Копируем release-версии
            cp "$CORE_RELEASE" linux_x64/
            cp "$IMGPROC_RELEASE" linux_x64/
            
            # Создаем симлинки для совместимости
            cd linux_x64
            CORE_BASE=$(basename "$CORE_RELEASE")
            IMGPROC_BASE=$(basename "$IMGPROC_RELEASE")
            
            # Извлекаем версию (например, 4.5.4)
            CORE_VER=$(echo "$CORE_BASE" | grep -oP '\d+\.\d+\.\d+')
            IMGPROC_VER=$(echo "$IMGPROC_BASE" | grep -oP '\d+\.\d+\.\d+')
            
            # Создаем симлинки: .so.4.5d -> .so.4.5.4
            ln -sf "$CORE_BASE" "libopencv_core.so.4.5d"
            ln -sf "$CORE_BASE" "libopencv_core.so.${CORE_VER%.*}"
            ln -sf "$CORE_BASE" "libopencv_core.so.${CORE_VER%%.*}"
            ln -sf "$CORE_BASE" "libopencv_core.so"
            
            ln -sf "$IMGPROC_BASE" "libopencv_imgproc.so.4.5d"
            ln -sf "$IMGPROC_BASE" "libopencv_imgproc.so.${IMGPROC_VER%.*}"
            ln -sf "$IMGPROC_BASE" "libopencv_imgproc.so.${IMGPROC_VER%%.*}"
            ln -sf "$IMGPROC_BASE" "libopencv_imgproc.so"
            
            cd ..
          else
            echo "❌ Release-версии не найдены! Пробуем debug-версии..."
            # Если release нет, берем debug и переименовываем
            CORE_DEBUG=$(find /usr -name "libopencv_core.so.[0-9]*" -type f 2>/dev/null | sort | tail -1)
            IMGPROC_DEBUG=$(find /usr -name "libopencv_imgproc.so.[0-9]*" -type f 2>/dev/null | sort | tail -1)
            
            if [ -n "$CORE_DEBUG" ] && [ -n "$IMGPROC_DEBUG" ]; then
              echo "⚠️  Используем debug-версии (переименовываем):"
              cp "$CORE_DEBUG" linux_x64/libopencv_core.so.4.5.4
              cp "$IMGPROC_DEBUG" linux_x64/libopencv_imgproc.so.4.5.4
              
              cd linux_x64
              ln -sf libopencv_core.so.4.5.4 libopencv_core.so.4.5d
              ln -sf libopencv_core.so.4.5.4 libopencv_core.so.4.5
              ln -sf libopencv_core.so.4.5.4 libopencv_core.so.4
              ln -sf libopencv_core.so.4.5.4 libopencv_core.so
              
              ln -sf libopencv_imgproc.so.4.5.4 libopencv_imgproc.so.4.5d
              ln -sf libopencv_imgproc.so.4.5.4 libopencv_imgproc.so.4.5
              ln -sf libopencv_imgproc.so.4.5.4 libopencv_imgproc.so.4
              ln -sf libopencv_imgproc.so.4.5.4 libopencv_imgproc.so
              
              cd ..
            else
              echo "❌ OpenCV не найден!"
              exit 1
            fi
          fi
          
          # 4. Проверяем результат
          echo "=== Итоговый список файлов ==="
          ls -lh linux_x64/
          
          echo "=== Проверка зависимостей ==="
          cd linux_x64
          ldd image_processing.so | grep -E "(opencv|not found)"
          cd ..
          
      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: linux_x64/
          

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and Extract OpenCV
        shell: pwsh
        run: |
          Write-Host "=== 1. Downloading OpenCV 4.10.0 ==="
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe" -OutFile "opencv.exe"
          
          Write-Host "=== 2. Verifying download size ==="
          $file = Get-Item "opencv.exe"
          if ($file.Length -lt 100MB) {
            throw "Downloaded file is too small ($($file.Length) bytes)."
          }
          
          Write-Host "=== 3. Extracting OpenCV to C:\opencv ==="
          7z x opencv.exe -oC:\opencv -y
          
      - name: Build DLL
        shell: pwsh
        run: |
          Write-Host "=== 4. Configuring CMake ==="
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR:PATH="C:/opencv/opencv/build" ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          
          Write-Host "=== 5. Building Release ==="
          cmake --build . --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }
          
      - name: Prepare Windows Binaries
        shell: pwsh
        run: |
          Write-Host "=== 6. Подготовка файлов для папки windows_x64 ==="
          Remove-Item -Path "windows_x64" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "windows_x64"
          
          Copy-Item -Path "build\Release\image_processing.dll" -Destination "windows_x64\" -Force
          
          Write-Host "=== Копирование зависимостей OpenCV ==="
          $opencv_build = "C:\opencv\opencv\build"
          $bin_path = Get-ChildItem -Path $opencv_build -Recurse -Directory -Filter "bin" | 
                      Where-Object { $_.FullName -match "x64" } | 
                      Select-Object -First 1 -ExpandProperty FullName
          
          if ($bin_path) {
            Write-Host "Найдена папка bin: $bin_path"
            
            $world_dll = Get-ChildItem -Path $bin_path -Filter "opencv_world4100.dll" | Select-Object -First 1
            
            if ($world_dll) {
              Write-Host "Копирование: $($world_dll.Name) ($([math]::Round($world_dll.Length/1MB, 2)) MB)"
              Copy-Item -Path $world_dll.FullName -Destination "windows_x64\" -Force
            } else {
              Write-Host "opencv_world4100.dll не найден, ищем раздельные модули..."
              Get-ChildItem -Path $bin_path -Filter "opencv_core*.dll" | Where-Object { $_.Name -notlike "*d.dll" } | ForEach-Object {
                Write-Host "Копирование: $($_.Name)"
                Copy-Item -Path $_.FullName -Destination "windows_x64\" -Force
              }
              Get-ChildItem -Path $bin_path -Filter "opencv_imgproc*.dll" | Where-Object { $_.Name -notlike "*d.dll" } | ForEach-Object {
                Write-Host "Копирование: $($_.Name)"
                Copy-Item -Path $_.FullName -Destination "windows_x64\" -Force
              }
            }
          } else {
            throw "Не удалось найти папку bin OpenCV в $opencv_build"
          }
          
          Write-Host "Итоговый состав папки windows_x64:"
          Get-ChildItem -Path "windows_x64\*.dll" | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB, 2)}}
      
      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: windows_x64/

  commit-binaries:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean old binaries from git
        run: |
          git rm -rf linux_x64/* 2>/dev/null || true
          git rm -rf windows_x64/* 2>/dev/null || true
          git commit -m "chore: clean old binaries" --allow-empty || true
      
      - name: Download Linux Binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: linux_x64
      
      - name: Download Windows Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows_x64
      
      - name: Commit and Push Binaries
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update pre-built binaries (DLL/SO)"
          file_pattern: "windows_x64/*.dll linux_x64/*.so*"
          commit_author: "GitHub Actions <actions@github.com>"
