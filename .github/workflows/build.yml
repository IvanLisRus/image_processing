name: Build Cross-Platform Libraries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopencv-dev
        
      - name: Build SO
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          
      - name: Bundle OpenCV SOs
        run: |
          echo "=== Копирование зависимостей OpenCV для Linux ==="
          # Копируем сами библиотеки и все их символьные ссылки (symlinks)
          cp /usr/lib/x86_64-linux-gnu/libopencv_core.so* build/
          cp /usr/lib/x86_64-linux-gnu/libopencv_imgproc.so* build/
          echo "Файлы в папке build:"
          ls -la build/libopencv*
          
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processing-linux-portable
          # Упаковываем всю папку build целиком
          path: build/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and Extract OpenCV
        shell: pwsh
        run: |
          Write-Host "=== 1. Downloading OpenCV 4.10.0 ==="
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe" -OutFile "opencv.exe"
          
          Write-Host "=== 2. Verifying download size ==="
          $file = Get-Item "opencv.exe"
          if ($file.Length -lt 100MB) {
            throw "Downloaded file is too small ($($file.Length) bytes)."
          }
          
          Write-Host "=== 3. Extracting OpenCV to C:\opencv ==="
          7z x opencv.exe -oC:\opencv -y
          
      - name: Build DLL
        shell: pwsh
        run: |
          Write-Host "=== 4. Configuring CMake ==="
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR:PATH="C:/opencv/opencv/build" ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          
          Write-Host "=== 5. Building Release ==="
          cmake --build . --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }
          
      - name: Bundle OpenCV DLLs
        shell: pwsh
        run: |
          Write-Host "=== 6. Копирование зависимостей OpenCV для Windows ==="
          # Копируем все DLL OpenCV из папки bin в папку Release рядом с нашей DLL
          $opencv_bin = "C:\opencv\opencv\build\x64\vc16\bin"
          $target_dir = "build\Release"
          
          Copy-Item -Path "$opencv_bin\opencv_*.dll" -Destination $target_dir -Force
          Write-Host "Файлы в папке Release:"
          Get-ChildItem -Path $target_dir\*.dll | Select-Object Name
          
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processing-windows-portable
          path: build/Release/
