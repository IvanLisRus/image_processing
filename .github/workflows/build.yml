name: Build Cross-Platform Libraries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopencv-dev
        
      - name: Build SO
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make
          
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processing-linux
          path: build/libimage_processing.so

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and Extract OpenCV
        shell: pwsh
        run: |
          Write-Host "=== 1. Downloading OpenCV 4.10.0 ==="
          curl.exe -L -o opencv.exe https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe
          if ($LASTEXITCODE -ne 0) { throw "Download failed with code $LASTEXITCODE" }
          
          Write-Host "=== 2. Extracting OpenCV ==="
          7z x opencv.exe -o.\opencv -y
          if ($LASTEXITCODE -ne 0) { throw "Extraction failed with code $LASTEXITCODE" }
          
          Write-Host "=== 3. Verifying extraction ==="
          Get-ChildItem .\opencv\opencv\build

      - name: Build DLL
        shell: pwsh
        run: |
          # Используем прямые слеши, чтобы CMake корректно обрабатывал пути в Windows
          $opencv_dir = "$env:GITHUB_WORKSPACE/opencv/opencv/build"
          Write-Host "=== 4. Configuring CMake with OpenCV_DIR: $opencv_dir ==="
          
          if (!(Test-Path $opencv_dir)) {
            throw "OpenCV directory not found at $opencv_dir"
          }
          
          mkdir build
          cd build
          
          cmake -G "Visual Studio 17 2022" -A x64 "-DOpenCV_DIR=$opencv_dir" ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          
          Write-Host "=== 5. Building Release ==="
          cmake --build . --config Release
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }
          
          Write-Host "=== 6. Verifying output ==="
          Get-ChildItem .\Release\*.dll

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processing-windows
          path: build/Release/image_processing.dll
