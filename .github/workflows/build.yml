name: Build Cross-Platform Libraries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopencv-dev
        
      - name: Build SO
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make
          
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processing-linux
          path: build/libimage_processing.so

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and Extract OpenCV
        run: |
          # curl.exe надежнее обрабатывает загрузку больших бинарных файлов с GitHub
          curl.exe -L -o opencv.exe https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe
          # Распаковываем в текущую рабочую директорию (создаст папку .\opencv)
          7z x opencv.exe -o.\opencv -y
          
      - name: Build DLL
        run: |
          mkdir build
          cd build
          # Формируем точный абсолютный путь к папке build внутри распакованного OpenCV
          $opencv_dir = "$env:GITHUB_WORKSPACE\opencv\opencv\build"
          Write-Host "Using OpenCV_DIR: $opencv_dir"
          
          cmake -G "Visual Studio 17 2022" -A x64 "-DOpenCV_DIR=$opencv_dir" ..
          cmake --build . --config Release
          
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processing-windows
          path: build/Release/image_processing.dll
